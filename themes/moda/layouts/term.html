{{ define "main" }}
  <header class="list-header" data-reveal>
    <h1 class="list-title">{{ .Title }}</h1>
    {{ .Content }}
  </header>

  {{ $hasOwnContent := ne (len (trim .Plain " \t\r\n")) 0 }}
  {{ if and (not .Pages) (not $hasOwnContent) }}
    <p class="empty-state">nothing here. try other pages</p>
  {{ end }}

  <div class="grid">
    {{ range .Pages }}
      {{ partial "card.html" . }}
    {{ end }}
  </div>
{{ end }}
